<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" class="scissors-svg-symbol" aria-hidden="true">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="scissorGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7A9" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <!-- White Silver Sheen -->
    <linearGradient id="scissorWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#ECECEC" />
      <stop offset="100%" stop-color="#D0D0D0" />
    </linearGradient>
    <!-- Hair Strand Glow -->
    <filter id="hairGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flowing Gold Hair Strand -->
  <g class="hair-strand-group" filter="url(#hairGlow)">
    <path class="hair-strand-path" d="M108 116 C 98 85, 78 65, 82 40 C 85 58, 96 74, 110 92 C 114 97, 118 108, 112 116 Z" fill="url(#scissorGoldGrad)" />
    <path class="hair-strand-accent" d="M116 110 C 112 85, 96 70, 94 50 C 98 64, 108 78, 120 98 Z" fill="#F7E7A9" opacity="0.8" />
  </g>

  <!-- Left / White Blade & Handle (Pivots around 120, 120) -->
  <g class="scissor-blade-white" id="scissorBladeWhite" style="transform-origin: 120px 120px;">
    <!-- Handle Loop -->
    <path d="M 85 160 C 72 145, 60 162, 70 178 C 80 194, 102 182, 94 166 Z" fill="none" stroke="url(#scissorWhiteGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="82" cy="170" r="14" fill="#0A0A0A" />
    <!-- Shank & Blade to Upper Right -->
    <path d="M 88 155 L 115 125 L 175 65 C 178 62, 175 58, 170 60 L 120 115 L 105 132 Z" fill="url(#scissorWhiteGrad)" />
  </g>

  <!-- Right / Gold Blade & Handle (Pivots around 120, 120) -->
  <g class="scissor-blade-gold" id="scissorBladeGold" style="transform-origin: 120px 120px;">
    <!-- Handle Loop -->
    <path d="M 155 160 C 168 145, 180 162, 170 178 C 160 194, 138 182, 146 166 Z" fill="none" stroke="url(#scissorGoldGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="158" cy="170" r="14" fill="#0A0A0A" />
    <!-- Shank & Blade to Upper Left -->
    <path d="M 152 155 L 125 125 L 65 65 C 62 62, 65 58, 70 60 L 120 115 L 135 132 Z" fill="url(#scissorGoldGrad)" />
  </g>

  <!-- Pivot Screw / Rivet -->
  <circle cx="120" cy="120" r="6" fill="#F3E2A0" stroke="#8A6605" stroke-width="1.5" />
  <circle cx="120" cy="120" r="2.5" fill="#0A0A0A" />
</svg>
